<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>마무리 및 질의응답</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="flex items-stretch justify-center w-[1280px] min-h-[720px] bg-gray-900 text-white relative overflow-hidden" style="font-family: 'Noto Sans KR', sans-serif;">
<!-- 배경 -->
<div class="absolute inset-0 z-0 bg-gray-900">
<div class="absolute inset-0 opacity-10 bg-pattern"></div>
</div>
<!-- 메인 콘텐츠 영역 -->
<div class="z-10 w-full flex flex-col px-20 py-12 items-center">
<!-- 상단 제목 영역 -->
<div class="flex items-center justify-center mb-14">
<div class="w-16 h-16 rounded-full bg-blue-600 flex items-center justify-center mr-6">
<i class="fas fa-comments text-3xl"></i>
</div>
<h1 class="text-5xl font-bold">
<p>마무리 및 질의응답</p>
</h1>
</div>
<!-- 중앙 감사 메시지 -->
<div class="flex justify-center items-center mb-16">
<div class="bg-blue-900 bg-opacity-30 p-10 rounded-lg border-l-4 border-blue-500 max-w-3xl">
<p class="text-center text-4xl text-blue-100 font-bold mb-4">
<i class="fas fa-heart text-red-400 mr-3"></i>
경청해 주셔서 감사합니다
</p>
</div>
</div>
<!-- 하단 안내 메시지 그리드 -->
<div class="grid grid-cols-3 gap-8 w-full max-w-5xl">
<!-- Q&A 안내 -->
<div class="flex flex-col bg-gray-800 bg-opacity-50 p-6 rounded-lg items-center text-center">
<div class="w-14 h-14 rounded-full bg-purple-700 bg-opacity-30 flex items-center justify-center mb-4 flex-shrink-0">
<i class="fas fa-question text-2xl text-purple-400"></i>
</div>
<h3 class="text-xl font-bold mb-2 text-purple-300">
<p>실시간 Q&amp;A</p>
</h3>
<p class="text-gray-300">
질문을 자유롭게 해주세요. 모든 질문에 성심껏 답변해 드리겠습니다.
</p>
</div>
<!-- 자료 공유 -->
<div class="flex flex-col bg-gray-800 bg-opacity-50 p-6 rounded-lg items-center text-center">
<div class="w-14 h-14 rounded-full bg-green-700 bg-opacity-30 flex items-center justify-center mb-4 flex-shrink-0">
<i class="fas fa-file-alt text-2xl text-green-400"></i>
</div>
<h3 class="text-xl font-bold mb-2 text-green-300">
<p>발표 자료 공유</p>
</h3>
<p class="text-gray-300">
오늘 강연 자료는 강연 후 공유 링크를 통해 다운로드 가능합니다.
</p>
</div>
<!-- 연락처 -->
<div class="flex flex-col bg-gray-800 bg-opacity-50 p-6 rounded-lg items-center text-center">
<div class="w-14 h-14 rounded-full bg-blue-700 bg-opacity-30 flex items-center justify-center mb-4 flex-shrink-0">
<i class="fas fa-envelope text-2xl text-blue-400"></i>
</div>
<h3 class="text-xl font-bold mb-2 text-blue-300">
<p>연락처</p>
</h3>
<p class="text-gray-300">
추가 질문이나 커리어 상담은 강연 후 안내되는 연락처로 문의해주세요.
</p>
</div>
</div>
<!-- 하단 메시지 -->
<div class="mt-14 flex justify-center">
<div class="max-w-3xl">
<p class="text-center text-lg text-gray-400">
<i class="fas fa-code text-sm text-blue-400 mr-2"></i>
행복한 코딩과 개발 여정이 되시길 바랍니다
<i class="fas fa-gamepad text-sm text-blue-400 ml-2"></i>
</p>
</div>
</div>
</div>
</div>
</body>
</html>
