<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>섹션 | 지금의 내가, 과거의 너에게</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="flex items-center justify-center w-[1280px] min-h-[720px] bg-gray-900 text-white relative overflow-hidden" style="font-family: 'Noto Sans KR', sans-serif;">
<!-- 배경 -->
<div class="absolute inset-0 z-0 bg-gray-900">
<div class="absolute inset-0 opacity-10 bg-pattern"></div>
</div>
<!-- 배경 디자인 요소 -->
<div class="absolute right-0 top-0 h-full w-1/3 bg-blue-800 bg-opacity-10"></div>
<div class="absolute left-0 bottom-0 h-1/4 w-full bg-blue-900 bg-opacity-10"></div>
<!-- 메인 콘텐츠 영역 -->
<div class="z-10 w-full max-w-5xl mx-auto flex flex-col items-center justify-center px-16 py-12">
<!-- 섹션 구분선 -->
<div class="w-24 h-2 bg-blue-500 mb-10"></div>
<!-- 섹션 아이콘 -->
<div class="w-24 h-24 rounded-full bg-blue-600 bg-opacity-20 flex items-center justify-center mb-10">
<i class="fas fa-comment-dots text-5xl text-blue-400"></i>
</div>
<!-- 섹션 제목 -->
<h1 class="text-6xl font-black mb-10 text-center tracking-tight">
<p>지금의 내가, <span class="text-blue-400">과거의 너에게</span></p>
</h1>
<!-- 구분선 -->
<div class="w-32 h-1 bg-blue-400 my-8 opacity-60"></div>
<!-- 섹션 설명 -->
<div class="max-w-2xl text-center">
<p class="text-2xl text-gray-300 mb-2">대학생 때 하면 '진짜' 도움이 되는 것들</p>
<p class="text-2xl text-gray-300">현업 관점의 우선순위와 실행 팁</p>
</div>
</div>
<!-- 코드 효과 -->
<div class="absolute bottom-6 left-6 text-xs text-gray-600 opacity-60 font-mono">
<p>class AdviceToYoungerSelf {</p>
<p>  void Share() {</p>
<p>    // 여러분께 드리는 조언들...</p>
<p>  }</p>
<p>}</p>
</div>
<!-- 배경 장식 -->
<div class="absolute top-6 right-6 text-blue-400 opacity-20">
<i class="fas fa-code text-6xl"></i>
</div>
</div>
</body>
</html>
