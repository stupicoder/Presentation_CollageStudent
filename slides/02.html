<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>목차</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="flex items-stretch justify-center w-[1280px] min-h-[720px] bg-gray-900 text-white relative overflow-hidden" style="font-family: 'Noto Sans KR', sans-serif;">
<!-- 배경 그라데이션 효과 -->
<div class="absolute inset-0 z-0 bg-gray-900">
<div class="absolute inset-0 opacity-10 bg-pattern"></div>
</div>
<!-- 왼쪽 사이드바 - 제목 -->
<div class="z-10 w-1/3 bg-gray-800 flex flex-col">
<div class="flex-1 flex flex-col items-start justify-center px-12 py-10 relative">
<!-- 제목 영역 -->
<div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
<h1 class="text-4xl font-bold mb-6 text-white">
<p>목차</p>
</h1>
<div class="flex items-center mb-10">
<div class="w-20 h-1 bg-blue-400"></div>
</div>
<!-- 아이콘 -->
<div class="mt-4 flex justify-center w-full">
<div class="w-24 h-24 rounded-full bg-blue-500 bg-opacity-20 flex items-center justify-center">
<i class="fas fa-list-ol text-5xl text-blue-400"></i>
</div>
</div>
</div>
</div>
<!-- 오른쪽 메인 콘텐츠 영역 -->
<div class="z-10 w-2/3 flex flex-col px-16 py-12">
<div class="flex items-center justify-center h-full">
<div class="w-full max-w-lg">
<!-- 목차 항목 -->
<div class="space-y-8">
<!-- 항목 1 -->
<div class="flex items-center">
<div class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center mr-6">
<p class="text-2xl font-bold">1</p>
</div>
<div>
<p class="text-2xl font-semibold">강연자 소개</p>
<p class="text-gray-400 mt-1">허창무 - Engine Programmer</p>
</div>
</div>
<!-- 항목 2 -->
<div class="flex items-center">
<div class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center mr-6">
<p class="text-2xl font-bold">2</p>
</div>
<div>
<p class="text-2xl font-semibold">발표</p>
<p class="text-gray-400 mt-1"><i class="fas fa-quote-left text-xs text-blue-400 mr-1"></i>지금의 내가, 과거의 너에게<i class="fas fa-quote-right text-xs text-blue-400 ml-1"></i></p>
</div>
</div>
<!-- 항목 3 -->
<div class="flex items-center">
<div class="w-12 h-12 rounded-full bg-blue-700 flex items-center justify-center mr-6">
<p class="text-2xl font-bold">3</p>
</div>
<div>
<p class="text-2xl font-semibold">Q&amp;A</p>
<p class="text-gray-400 mt-1">직무/현업 · 기술/엔진 · 취업/준비</p>
</div>
</div>
<!-- 항목 4 -->
<div class="flex items-center">
<div class="w-12 h-12 rounded-full bg-blue-800 flex items-center justify-center mr-6">
<p class="text-2xl font-bold">4</p>
</div>
<div>
<p class="text-2xl font-semibold">마무리</p>
<p class="text-gray-400 mt-1">요약 및 실시간 질문</p>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
