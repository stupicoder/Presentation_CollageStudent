<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>프로그래밍 외에 필요한 역량</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="flex items-stretch justify-center w-[1280px] min-h-[720px] bg-gray-900 text-white relative overflow-hidden" style="font-family: 'Noto Sans KR', sans-serif;">
<!-- 배경 -->
<div class="absolute inset-0 z-0 bg-gray-900">
<div class="absolute inset-0 opacity-10 bg-pattern"></div>
</div>
<!-- 왼쪽 사이드바 - 질문 영역 -->
<div class="z-10 w-1/3 bg-gray-800 flex flex-col">
<div class="flex-1 flex flex-col items-start justify-center px-12 py-10 relative">
<!-- 상단 강조선 -->
<div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
<!-- 질문 타이틀 -->
<h1 class="text-3xl font-bold mb-6 text-white">
<p>프로그래밍 외에 필요한 역량</p>
</h1>
<div class="flex items-center mb-10">
<div class="w-20 h-1 bg-blue-400"></div>
</div>
<!-- Q&A 아이콘 -->
<div class="w-20 h-20 rounded-full bg-blue-500 bg-opacity-20 flex items-center justify-center mb-6">
<i class="fas fa-puzzle-piece text-4xl text-blue-400"></i>
</div>
<!-- 질문 표시 -->
<div class="bg-gray-700 bg-opacity-50 p-5 rounded-lg w-full mt-4">
<p class="text-lg italic text-gray-300">
<i class="fas fa-quote-left text-sm text-blue-400 mr-2"></i>
          프로그래밍 역량 외에 필요한 게임 프로그래머로서의 역량에는 무엇이 있나요?
          <i class="fas fa-quote-right text-sm text-blue-400 ml-2"></i>
</p>
</div>
</div>
</div>
<!-- 오른쪽 메인 콘텐츠 영역 - 답변 -->
<div class="z-10 w-2/3 flex flex-col px-12 py-10">
<!-- 게임 감각 섹션 -->
<div class="mb-6">
<div class="flex items-center mb-3">
<i class="fas fa-gamepad text-xl text-blue-400 mr-3"></i>
<h2 class="text-2xl font-bold text-white">
<p>게임 감각</p>
</h2>
</div>
<div class="pl-9">
<p class="text-gray-300">타격감/카메라/사운드 상호작용 이해</p>
</div>
</div>
<!-- 문제해결 섹션 -->
<div class="mb-6">
<div class="flex items-center mb-3">
<i class="fas fa-chart-line text-xl text-blue-400 mr-3"></i>
<h2 class="text-2xl font-bold text-white">
<p>문제 해결 프로세스</p>
</h2>
</div>
<div class="pl-9 flex flex-wrap">
<div class="flex items-start w-1/2 mb-2">
<i class="fas fa-search text-blue-400 mt-1 mr-2"></i>
<p class="text-gray-300">문제정의</p>
</div>
<div class="flex items-start w-1/2 mb-2">
<i class="fas fa-lightbulb text-blue-400 mt-1 mr-2"></i>
<p class="text-gray-300">가설 수립</p>
</div>
<div class="flex items-start w-1/2 mb-2">
<i class="fas fa-flask text-blue-400 mt-1 mr-2"></i>
<p class="text-gray-300">실험 설계</p>
</div>
<div class="flex items-start w-1/2 mb-2">
<i class="fas fa-database text-blue-400 mt-1 mr-2"></i>
<p class="text-gray-300">데이터 기반 의사결정</p>
</div>
</div>
</div>
<!-- 커뮤니케이션 섹션 -->
<div class="mb-6">
<div class="flex items-center mb-3">
<i class="fas fa-comments text-xl text-blue-400 mr-3"></i>
<h2 class="text-2xl font-bold text-white">
<p>문서화 &amp; 협업</p>
</h2>
</div>
<div class="pl-9">
<p class="text-gray-300">문서화/PRD, 협업(디자인·아트·서버) 커뮤니케이션</p>
</div>
</div>
<!-- 프로젝트 관리 섹션 -->
<div class="mb-6">
<div class="flex items-center mb-3">
<i class="fas fa-tasks text-xl text-blue-400 mr-3"></i>
<h2 class="text-2xl font-bold text-white">
<p>프로젝트 운영</p>
</h2>
</div>
<div class="pl-9">
<p class="text-gray-300">우선순위/리스크 관리, 피드백 수용과 반복</p>
</div>
</div>
<!-- 인사이트 박스 -->
<div class="mt-6 bg-blue-900 bg-opacity-20 p-4 rounded-md border-l-4 border-blue-500">
<div class="flex">
<i class="fas fa-lightbulb text-yellow-400 mt-1 mr-3"></i>
<p class="text-gray-300">코드를 작성하는 능력만큼 중요한 것은 '어떤 코드'를 '왜' 작성해야 하는지 이해하고 소통하는 능력입니다.</p>
</div>
</div>
</div>
<!-- 코드 시각 효과 -->
<div class="absolute bottom-3 right-3 text-xs text-gray-600 font-mono">
<p>Developer.GetSoftSkills();</p>
</div>
</div>
</body>
</html>
