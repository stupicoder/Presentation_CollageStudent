<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>조언 3–4: 품질과 포트폴리오</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="flex items-stretch justify-center w-[1280px] min-h-[720px] bg-gray-900 text-white relative overflow-hidden" style="font-family: 'Noto Sans KR', sans-serif;">
<!-- 배경 그라데이션 효과 -->
<div class="absolute inset-0 z-0 bg-gray-900">
<div class="absolute inset-0 opacity-10 bg-pattern"></div>
</div>
<!-- 왼쪽 사이드바 - 제목 -->
<div class="z-10 w-1/3 bg-gray-800 flex flex-col">
<div class="flex-1 flex flex-col items-start justify-center px-12 py-10 relative">
<!-- 제목 영역 -->
<div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
<h1 class="text-4xl font-bold mb-6 text-white">
<p>조언 3–4: 품질과 포트폴리오</p>
</h1>
<div class="flex items-center mb-10">
<div class="w-20 h-1 bg-blue-400"></div>
</div>
<!-- 핵심 메시지 -->
<div class="bg-gray-700 bg-opacity-50 p-6 rounded-lg w-full">
<div class="flex items-center mb-4">
<div class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center">
<i class="fas fa-code-branch text-2xl"></i>
</div>
<div class="ml-4">
<p class="text-xl font-bold">지속 가능한</p>
<p class="text-blue-400">개발 습관 형성</p>
</div>
</div>
<div class="mt-6">
<p class="text-gray-300">
<i class="fas fa-quote-left text-blue-400 mr-2"></i> 품질은 결과물이 아닌<br/>과정에서 나온다
</p>
</div>
</div>
</div>
</div>
<!-- 오른쪽 메인 콘텐츠 영역 -->
<div class="z-10 w-2/3 flex flex-col px-12 py-10">
<!-- 조언 3: 품질 습관 -->
<div class="mb-10">
<div class="flex items-center mb-4">
<div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center mr-3">
<p class="font-bold">3</p>
</div>
<h2 class="text-2xl font-bold text-white">
<p>품질 습관</p>
</h2>
</div>
<div class="pl-14 grid grid-cols-2 gap-3">
<div class="flex items-start">
<i class="fas fa-code-commit text-blue-400 mt-1 mr-2"></i>
<div>
<p class="text-gray-200 font-medium">코드리뷰/PR</p>
<p class="text-sm text-gray-400">동료 피드백, 설계 검증</p>
</div>
</div>
<div class="flex items-start">
<i class="fas fa-vial text-blue-400 mt-1 mr-2"></i>
<div>
<p class="text-gray-200 font-medium">테스트</p>
<p class="text-sm text-gray-400">단위·인게임 검증 루틴</p>
</div>
</div>
<div class="flex items-start">
<i class="fas fa-file-alt text-blue-400 mt-1 mr-2"></i>
<div>
<p class="text-gray-200 font-medium">문서화</p>
<p class="text-sm text-gray-400">README, 이슈 템플릿</p>
</div>
</div>
<div class="flex items-start">
<i class="fas fa-server text-blue-400 mt-1 mr-2"></i>
<div>
<p class="text-gray-200 font-medium">CI/CD</p>
<p class="text-sm text-gray-400">자동 빌드/테스트, Git 전략</p>
</div>
</div>
</div>
</div>
<!-- 조언 4: 포트폴리오 전략 -->
<div class="mb-4">
<div class="flex items-center mb-4">
<div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center mr-3">
<p class="font-bold">4</p>
</div>
<h2 class="text-2xl font-bold text-white">
<p>포트폴리오 전략</p>
</h2>
</div>
<div class="pl-14">
<div class="flex items-start mb-4">
<i class="fab fa-github text-blue-400 mt-1 mr-2"></i>
<div>
<p class="text-gray-200 font-medium">GitHub 상단 핀 3개</p>
<p class="text-sm text-gray-400">'완성' + '심화 주제' 포함 (기술/면접관 입장 고려)</p>
</div>
</div>
<div class="flex items-start mb-4">
<i class="fas fa-blog text-blue-400 mt-1 mr-2"></i>
<div>
<p class="text-gray-200 font-medium">기술 블로그 5편</p>
<p class="text-sm text-gray-400">문제→가설→실험→데이터→결론 구조 (증거 기반)</p>
</div>
</div>
<div class="flex items-start">
<i class="fas fa-search-plus text-blue-400 mt-1 mr-2"></i>
<div>
<p class="text-gray-200 font-medium">엔진 소스 탐색 기록</p>
<p class="text-sm text-gray-400">모듈 분석/확장 사례 (심층 이해 증명)</p>
</div>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
