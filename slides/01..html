<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>게임 개발 현업자 강연</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
<div class="flex items-center justify-center w-[1280px] min-h-[720px] bg-gray-900 text-white relative overflow-hidden" style="font-family: 'Noto Sans KR', sans-serif;">
<!-- 배경 패턴 -->
<div class="absolute inset-0 z-0 opacity-20">
<div class="absolute inset-0 bg-cover bg-center" style='background-image: url("https://page.gensparksite.com/slides_images/d9d1055c89937ee01208d338fd6eb049.webp");'></div>
</div>
<!-- 콘텐츠 영역 -->
<div class="z-10 flex flex-col items-center justify-center w-full px-24 py-16 text-center relative">
<!-- 상단 아이콘 -->
<div class="mb-6">
<i class="fas fa-gamepad text-5xl text-blue-400"></i>
</div>
<!-- 제목 및 서브타이틀 -->
<h1 class="text-6xl font-black tracking-tight mb-4">
<p><span class="text-blue-400">게임 개발 현업자 강연</span></p>
</h1>
<h2 class="text-4xl font-bold mb-10 text-gray-300">
<p>엔진 프로그래머의 조언</p>
</h2>
<!-- 주제 -->
<div class="mb-12 py-3 px-8 bg-blue-800 bg-opacity-60 rounded-md">
<p class="text-2xl font-medium italic">"지금의 내가, 과거의 너에게"</p>
</div>
<!-- 강연자 정보 -->
<div class="mb-8">
<p class="text-3xl font-bold">허창무 <span class="text-gray-300">|</span> <span class="text-blue-400">Engine Programmer</span></p>
</div>
<!-- 일시 및 대상 -->
<div class="flex flex-col gap-3 bg-gray-800 bg-opacity-60 px-8 py-6 rounded-lg">
<p class="text-xl"><i class="far fa-calendar-alt mr-3 text-blue-400"></i> 일시: 11월 22일 (토) 14:00~15:00</p>
<p class="text-xl"><i class="fas fa-users mr-3 text-blue-400"></i> 대상: 대학생 · 게임 프로그래밍 관심자</p>
</div>
</div>
</div>
</body>
</html>
